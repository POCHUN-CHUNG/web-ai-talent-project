server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # 打包後的 JS／CSS（檔名含內容雜湊，內容一變檔名就變）：可以讓瀏覽器長期快取；
    # 找不到就回 404，不可回首頁——否則瀏覽器拿到的是 HTML，樣式表會被擋掉（安全標頭 nosniff），整頁變成沒有樣式
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # 其他網址一律交給前端路由（index.html）；index.html 每次都要向伺服器確認是否有新版，
    # 部署後瀏覽器才不會沿用舊的 index.html 去載入已經不存在的舊檔案
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
